
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎈 連線遊戲生成器 🎈</title>
    <!-- 引入 jsPDF 用於產生 PDF 檔案 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=ZCOOL+KuaiLe&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;
            background-color: #fff4e6;
            background-image: radial-gradient(#ffd8a8 2px, transparent 0);
            background-size: 30px 30px;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; color: #5d4037;
        }

        h1 { 
            font-family: 'ZCOOL KuaiLe', cursive; 
            font-size: 36px; color: #ff8c42; 
            margin: 0 0 20px 0; text-align: center;
            text-shadow: 2px 2px 0px #fff;
        }

        .container {
            display: flex; flex-direction: column; gap: 20px;
            width: 100%; max-width: 1000px; align-items: center;
        }

        .controls-container {
            background-color: #ffffff; border-radius: 25px; padding: 20px 30px;
            border: 5px solid #ffdfb3; box-shadow: 0 10px 20px rgba(255, 140, 66, 0.1);
            display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;
            width: 100%; align-items: center;
        }

        .control-item { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px;}
        select { 
            padding: 8px 15px; border-radius: 15px; border: 3px solid #ffcc99; 
            font-family: inherit; font-weight: 900; font-size: 16px; 
            outline: none; background: #fff9f2; color: #5d4037; cursor: pointer;
        }

        .btn-group {
            display: flex; width: 100%; justify-content: center; gap: 20px; margin-top: 5px;
        }

        .btn {
            border: none; padding: 12px 25px; font-size: 18px; font-weight: 900;
            border-radius: 20px; cursor: pointer; transition: transform 0.1s;
            color: white; font-family: 'Nunito', 'Microsoft JhengHei', sans-serif;
        }
        .btn-preview { background-color: #4ecdc4; box-shadow: 0 5px 0px #3baba3; }
        .btn-preview:active { transform: translateY(5px); box-shadow: 0 0px 0px #3baba3; }
        .btn-download { background-color: #ff6b6b; box-shadow: 0 5px 0px #e05252; }
        .btn-download:active { transform: translateY(5px); box-shadow: 0 0px 0px #e05252; }

        .preview-container { width: 100%; }

        /* A4 橫向比例 (1684 x 1190)，透過 CSS 等比例縮小顯示 */
        canvas {
            width: 100%; max-width: 1000px; height: auto; aspect-ratio: 1684 / 1190;
            background-color: #fff; border: 4px dashed #ffcc99; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>🎈 連線遊戲生成器 🎈</h1>

    <div class="container">
        <div class="controls-container">
            <div class="control-item">
                <label>🔡</label>
                <select id="mode">
                    <option value="number">123 數字</option>
                    <option value="letter">ABC 大寫字母</option>
                    <option value="letter_lower">abc 小寫字母</option>
                </select>
            </div>
            <div class="control-item">
                <label>🌟</label>
                <select id="difficulty">
                    <option value="8">簡單 (8點內)</option>
                    <option value="15">一般 (15點內)</option>
                    <option value="26">困難 (26點內)</option>
                </select>
            </div>
            <div class="control-item">
                <label>🎨</label>
                <select id="theme">
                    <option value="animal">🐻 動物朋友</option>
                    <option value="vehicle">🚗 交通工具</option>
                    <option value="food">🍎 美味點心</option>
                </select>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-preview" onclick="generatePreview()">🎲 換一張圖</button>
                <button class="btn btn-download" onclick="downloadPDF()">⬇️ 下載 A4 橫向 PDF</button>
            </div>
        </div>

        <div class="preview-container">
            <!-- 實際 A4 橫向尺寸 (300dpi): 1684 x 1190 -->
            <canvas id="pdfCanvas" width="1684" height="1190"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        let currentItem = null;

        const outlineColor = '#a89f91'; 
        const dotColor = '#5d4037';

        const categories = {
            animal: [
                {
                    name: '貓頭鷹',
                    path: "M 160 80 Q 200 130 240 80 Q 300 110 310 200 Q 320 280 270 320 Q 200 340 130 320 Q 80 280 90 200 Q 100 110 160 80 Z",
                    drawInner: (ctx) => {
                        ctx.beginPath(); ctx.ellipse(150, 170, 35, 45, 0, 0, Math.PI*2); ctx.stroke();
                        ctx.beginPath(); ctx.ellipse(250, 170, 35, 45, 0, 0, Math.PI*2); ctx.stroke();
                        ctx.fillStyle = outlineColor; ctx.beginPath(); ctx.arc(150, 170, 10, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(250, 170, 10, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.moveTo(185, 230); ctx.lineTo(215, 230); ctx.lineTo(200, 260); ctx.closePath(); ctx.stroke();
                    }
                },
                {
                    name: '小貓咪',
                    path: "M 100 200 L 120 100 L 180 140 Q 200 130 220 140 L 280 100 L 300 200 Q 320 300 200 320 Q 80 300 100 200 Z",
                    drawInner: (ctx) => {
                        ctx.beginPath(); ctx.arc(160, 200, 12, 0, Math.PI*2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(240, 200, 12, 0, Math.PI*2); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(190, 230); ctx.lineTo(210, 230); ctx.lineTo(200, 245); ctx.closePath(); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(140, 230); ctx.lineTo(90, 220); ctx.stroke(); ctx.beginPath(); ctx.moveTo(140, 240); ctx.lineTo(90, 250); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(260, 230); ctx.lineTo(310, 220); ctx.stroke(); ctx.beginPath(); ctx.moveTo(260, 240); ctx.lineTo(310, 250); ctx.stroke();
                    }
                },
                {
                    name: '可愛小魚',
                    path: "M 120 200 Q 160 100 260 150 L 320 100 L 300 200 L 320 300 L 260 250 Q 160 300 120 200 Z",
                    drawInner: (ctx) => {
                        ctx.beginPath(); ctx.arc(170, 180, 15, 0, Math.PI*2); ctx.stroke();
                        ctx.fillStyle = outlineColor; ctx.beginPath(); ctx.arc(170, 180, 6, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(170, 220, 15, 0.2*Math.PI, 0.8*Math.PI); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(220, 145); ctx.lineTo(240, 100); ctx.lineTo(250, 155); ctx.stroke();
                    }
                }
            ],
            vehicle: [
                {
                    name: '噗噗小汽車',
                    path: "M 60 250 L 60 160 L 120 160 L 160 100 L 260 100 L 300 160 L 340 160 L 340 250 Z",
                    drawInner: (ctx) => {
                        ctx.beginPath(); ctx.arc(120, 250, 30, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(120, 250, 10, 0, Math.PI*2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(280, 250, 30, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(280, 250, 10, 0, Math.PI*2); ctx.stroke();
                        ctx.beginPath(); ctx.rect(160, 110, 45, 50); ctx.stroke(); ctx.beginPath(); ctx.rect(215, 110, 40, 50); ctx.stroke();
                    }
                },
                {
                    name: '飛天火箭',
                    path: "M 200 60 Q 240 120 260 240 L 300 280 L 260 280 L 200 320 L 140 280 L 100 280 L 140 240 Q 160 120 200 60 Z",
                    drawInner: (ctx) => {
                        ctx.beginPath(); ctx.arc(200, 160, 25, 0, Math.PI*2); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(200, 100); ctx.lineTo(200, 120); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(160, 240); ctx.lineTo(240, 240); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(160, 320); ctx.lineTo(180, 360); ctx.lineTo(200, 340); ctx.lineTo(220, 360); ctx.lineTo(240, 320); ctx.stroke();
                    }
                }
            ],
            food: [
                {
                    name: '大蘋果',
                    path: "M 200 120 C 280 80 340 150 320 250 C 300 320 220 320 200 300 C 180 320 100 320 80 250 C 60 150 120 80 200 120 Z",
                    drawInner: (ctx) => {
                        ctx.beginPath(); ctx.moveTo(200, 120); ctx.quadraticCurveTo(190, 80, 210, 50); ctx.stroke();
                        ctx.beginPath(); ctx.ellipse(240, 80, 30, 15, Math.PI/6, 0, Math.PI*2); ctx.stroke();
                    }
                },
                {
                    name: '冰淇淋甜筒',
                    path: "M 140 160 Q 140 80 200 80 Q 260 80 260 160 L 280 180 L 200 340 L 120 180 Z",
                    drawInner: (ctx) => {
                        ctx.beginPath(); ctx.moveTo(140, 220); ctx.lineTo(240, 280); ctx.stroke(); ctx.beginPath(); ctx.moveTo(160, 200); ctx.lineTo(260, 260); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(260, 220); ctx.lineTo(160, 280); ctx.stroke(); ctx.beginPath(); ctx.moveTo(240, 200); ctx.lineTo(140, 260); ctx.stroke();
                        ctx.beginPath(); ctx.arc(200, 140, 15, 0, Math.PI, true); ctx.stroke();
                    }
                }
            ]
        };

        function getLabel(index, mode) {
            if (mode === 'letter') return String.fromCharCode(65 + index);
            if (mode === 'letter_lower') return String.fromCharCode(97 + index);
            return (index + 1).toString();
        }

        function getPointsFromPath(pathString, numPoints) {
            const points = [];
            const pathElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            pathElement.setAttribute('d', pathString);
            const totalLength = pathElement.getTotalLength();
            for (let i = 0; i < numPoints; i++) {
                const pt = pathElement.getPointAtLength(i * totalLength / numPoints);
                points.push({ x: pt.x, y: pt.y });
            }
            return points;
        }

        function generatePreview() {
            const diff = parseInt(document.getElementById('difficulty').value);
            const themeKey = document.getElementById('theme').value;
            const mode = document.getElementById('mode').value;

            const themeList = categories[themeKey];
            currentItem = themeList[Math.floor(Math.random() * themeList.length)];

            drawWorksheet(currentItem, diff, mode);
        }

        function drawWorksheet(item, numPoints, mode) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#ffdfb3';
            ctx.lineWidth = 15;
            ctx.setLineDash([30, 25]);
            ctx.lineCap = 'round';
            ctx.strokeRect(50, 50, canvas.width - 100, canvas.height - 100);
            ctx.setLineDash([]);

            ctx.fillStyle = '#ff8c42';
            ctx.font = 'bold 70px "Comic Sans MS", "ZCOOL KuaiLe", "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`✨ 講畫出：${item.name} ✨`, canvas.width / 2, 160);
            
            ctx.fillStyle = '#5d4037';
            ctx.font = 'bold 36px "Comic Sans MS", "Microsoft JhengHei", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`姓名：_________________`, 150, 280);
            
            ctx.textAlign = 'right';
            ctx.fillText(`日期：______月______日`, canvas.width - 150, 280);
            
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#f3e5f5';
            ctx.beginPath(); ctx.moveTo(100, 320); ctx.lineTo(canvas.width - 100, 320); ctx.stroke();

            const points = getPointsFromPath(item.path, numPoints);

            ctx.save();
            const scale = 2.1;
            const offsetX = (canvas.width - 400 * scale) / 2;
            const offsetY = 330; 
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            item.drawInner(ctx);

            points.forEach((pt, index) => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = dotColor;
                ctx.fill();
                
                ctx.font = '900 18px "Nunito", "Comic Sans MS", sans-serif';
                ctx.fillStyle = dotColor;
                const centerX = 200, centerY = 200;
                const angle = Math.atan2(pt.y - centerY, pt.x - centerX);
                const textX = pt.x + Math.cos(angle) * 16;
                const textY = pt.y + Math.sin(angle) * 16 + 6;
                
                ctx.textAlign = 'center';
                ctx.fillText(getLabel(index, mode), textX, textY);
            });

            ctx.restore();
        }

        function downloadPDF() {
            if (!currentItem) return;
            
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('l', 'pt', 'a4');
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            
            pdf.addImage(imgData, 'JPEG', 0, 0, 841.89, 595.28);
            pdf.save(`可愛連線學習單_${currentItem.name}.pdf`);
        }

        window.onload = () => setTimeout(generatePreview, 300);
    </script>
</body>
</html>
